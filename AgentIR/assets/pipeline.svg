<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 1100 480" role="img" aria-labelledby="t d">
  <title id="t">The AgentIR pipeline</title>
  <desc id="d">A Python program is traced into a guarded graph of engine nodes, tool nodes, ops, and decisions. The scheduler issues data-ready work to vLLM engines and tool workers, committed work first and speculative work within a window and a budget. Results flow back to resolve data dependencies and decisions; surviving work commits and losing work is squashed. Verification compares the committed computation with a serial reference.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="m1 1 6 3.5-6 3.5" fill="none" stroke="#546b83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="m1 1 6 3.5-6 3.5" fill="none" stroke="#a77835" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#233746;font-size:14px}
      .stage{font-size:12px;fill:#5c6d7c;letter-spacing:.08em}
      .h{font-size:16px;font-weight:650}
      .s{font-size:12.5px;fill:#5c6d7c}
      .m{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:12.5px}
      .box{fill:#fff;stroke:#cfd9de;stroke-width:1.3}
      .core{fill:#eef4f2;stroke:#8fb3a8}
      .l{fill:none;stroke:#546b83;stroke-width:1.5;marker-end:url(#a)}
      .g{fill:none;stroke:#a77835;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#b)}
    </style>
  </defs>
  <rect x="1" y="-9" width="1098" height="478" rx="12" fill="#fff" stroke="#e3e9ed"/>

  <text class="stage" x="30" y="36">01 · PROGRAM</text>
  <text class="stage" x="290" y="36">02 · TRACE</text>
  <text class="stage" x="480" y="36">03 · EXECUTE</text>
  <text class="stage" x="870" y="36">04 · RESOLVE</text>

  <!-- program -->
  <rect class="box" x="30" y="60" width="220" height="150" rx="8"/>
  <text class="h" x="46" y="88">Python program</text>
  <g class="m">
    <text x="46" y="118">pool = expand(q, 4)</text>
    <text x="46" y="140">rank = op(vote, ...)</text>
    <text x="46" y="162">best = choose(pool, rank)</text>
    <text x="46" y="184" fill="#16766d">y = infer(cat(best, t))</text>
  </g>
  <path class="l" d="M250 135h32"/>

  <!-- tracer -->
  <rect class="box" x="290" y="60" width="150" height="150" rx="8"/>
  <text class="h" x="306" y="88">Tracer</text>
  <text class="s" x="306" y="114">reserve draw</text>
  <text class="s" x="306" y="134">freeze descriptor</text>
  <text class="s" x="306" y="154">attach guard</text>
  <text class="s" x="306" y="174">register, return</text>
  <text class="s" x="306" y="194">never waits</text>
  <path class="l" d="M440 135h32"/>

  <!-- guarded graph -->
  <rect class="box core" x="480" y="60" width="200" height="150" rx="8"/>
  <text class="h" x="496" y="88">Guarded graph</text>
  <text class="s" x="496" y="114">E-nodes · T-nodes · ops</text>
  <text class="s" x="496" y="134">decisions</text>
  <text class="s" x="496" y="160">solid edge: needs data</text>
  <text class="s" x="496" y="180" fill="#a77835">dashed edge: needs a decision</text>
  <text class="s" x="496" y="200">to survive, not to start</text>
  <path class="l" d="M580 210v30"/>

  <!-- scheduler -->
  <rect class="box core" x="480" y="242" width="210" height="120" rx="8"/>
  <text class="h" x="496" y="270">Scheduler</text>
  <text class="s" x="496" y="296">ready + guard true → commit</text>
  <text class="s" x="496" y="316">ready + guard pending →</text>
  <text class="s" x="496" y="336">speculate within W and β</text>

  <!-- engines and tools -->
  <path class="l" d="M690 285h25v-165h30"/>
  <rect class="box" x="745" y="80" width="200" height="86" rx="8"/>
  <text class="h" x="761" y="108">vLLM engines</text>
  <text class="s" x="761" y="132">in-process · judge server</text>
  <text class="s" x="761" y="152">certified remote (Tier-1)</text>

  <path class="l" d="M690 302h55"/>
  <rect class="box" x="745" y="262" width="200" height="86" rx="8"/>
  <text class="h" x="761" y="290">Tool workers</text>
  <text class="s" x="761" y="314">speculable: may run early</text>
  <text class="s" x="761" y="334">unknown: waits for commit</text>

  <!-- resolve -->
  <path class="g" d="M945 123h50v190h-50"/>
  <path class="g" d="M945 305h50"/>
  <rect class="box" x="990" y="176" width="90" height="72" rx="8"/>
  <text class="h" x="1004" y="203">Results</text>
  <text class="s" x="1004" y="226">resolve</text>
  <path class="g" d="M1035 176V22H580v38"/>
  <text class="s" x="640" y="16">outputs fill data holes · rankings resolve decisions</text>

  <!-- commit / squash -->
  <path class="l" d="M580 362v40"/>
  <rect class="box core" x="480" y="402" width="200" height="50" rx="8"/>
  <text class="h" x="496" y="424">Commit or squash</text>
  <text class="s" x="496" y="443">force() publishes only survivors</text>

  <!-- verification -->
  <rect class="box" x="30" y="262" width="410" height="100" rx="8" stroke-dasharray="5 4"/>
  <text class="h" x="46" y="290">Verification and diagnostics</text>
  <text class="s" x="46" y="314">serial reference interpreter · spec-off vs spec-on differential</text>
  <text class="s" x="46" y="334">ledger of every node: registered, ready, issued, done, resolved</text>
  <text class="s" x="46" y="354">SVG timelines · paired benchmarks</text>
  <path class="l" d="M480 427H235v-65" stroke-dasharray="5 4"/>
  <text class="s" x="250" y="420">same bytes, same answer?</text>
</svg>
