<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="t d">
  <title id="t">The hoist: continuing an unresolved choice</title>
  <desc id="d">A program chooses one of three candidates with a ranking that has not resolved, then continues from the choice. The tracer registers three continuation nodes, one per candidate. Each has a solid data edge from its own candidate and a dashed guard from the decision. When the ranking picks B, the B continuation commits and the A and C continuations are squashed.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="m1 1 6 3.5-6 3.5" fill="none" stroke="#546b83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="m1 1 6 3.5-6 3.5" fill="none" stroke="#a77835" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#233746;font-size:14px}
      .h{font-size:15px;font-weight:650}.s{font-size:12.5px;fill:#5c6d7c}
      .m{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:12.5px}
      .box{fill:#fff;stroke:#cfd9de;stroke-width:1.3}
      .cand{fill:#eef3f9;stroke:#b7c8d9}
      .keep{fill:#dcefe6;stroke:#4e8a72}
      .dead{fill:#f6e6e3;stroke:#b0574c;stroke-dasharray:4 3}
      .dec{fill:#fbf3e6;stroke:#d3a55c}
      .l{fill:none;stroke:#546b83;stroke-width:1.5;marker-end:url(#a)}
      .g{fill:none;stroke:#a77835;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#b)}
    </style>
  </defs>
  <rect x="1" y="1" width="998" height="398" rx="12" fill="#fff" stroke="#e3e9ed"/>

  <rect class="box" x="26" y="26" width="270" height="130" rx="8"/>
  <text class="h" x="42" y="52">Source</text>
  <g class="m">
    <text x="42" y="80">A, B, C = expand(q, 3)</text>
    <text x="42" y="102">rank = op(score, ...)   # Val</text>
    <text x="42" y="124">best = choose([A,B,C], rank)[0]</text>
    <text x="42" y="146" fill="#16766d">y = infer(cat(best, tail))</text>
  </g>
  <text class="s" x="42" y="185">rank is still pending when infer runs.</text>
  <text class="s" x="42" y="204">Python cannot know which member best is,</text>
  <text class="s" x="42" y="223">so the tracer registers every possibility.</text>

  <!-- candidates -->
  <rect class="box cand" x="380" y="40" width="90" height="40" rx="6"/><text class="h" x="425" y="65" text-anchor="middle">A</text>
  <rect class="box cand" x="380" y="160" width="90" height="40" rx="6"/><text class="h" x="425" y="185" text-anchor="middle">B</text>
  <rect class="box cand" x="380" y="280" width="90" height="40" rx="6"/><text class="h" x="425" y="305" text-anchor="middle">C</text>

  <!-- decision -->
  <rect class="box dec" x="380" y="350" width="290" height="36" rx="6"/>
  <text class="m" x="392" y="373">d = choose(rank)   resolves to → B</text>

  <!-- continuations -->
  <rect class="box dead" x="620" y="30" width="180" height="60" rx="6"/>
  <text class="m" x="632" y="53">y_A = cat(A, tail)</text><text class="s" x="632" y="76">guard At(d, 0, A) → false</text>
  <rect class="box keep" x="620" y="150" width="180" height="60" rx="6"/>
  <text class="m" x="632" y="173">y_B = cat(B, tail)</text><text class="s" x="632" y="196">guard At(d, 0, B) → true</text>
  <rect class="box dead" x="620" y="270" width="180" height="60" rx="6"/>
  <text class="m" x="632" y="293">y_C = cat(C, tail)</text><text class="s" x="632" y="316">guard At(d, 0, C) → false</text>

  <path class="l" d="M470 60h150"/>
  <path class="l" d="M470 180h150"/>
  <path class="l" d="M470 300h150"/>
  <path class="g" d="M560 350V90"/>
  <path class="g" d="M600 350V210"/>
  <path class="g" d="M640 350v-20"/>

  <text class="s" x="820" y="55">squashed</text>
  <text class="s" x="820" y="175" fill="#4e8a72">committed</text>
  <text class="s" x="820" y="295">squashed</text>

  <text class="s" x="820" y="120">solid: data edge</text>
  <text class="s" x="820" y="140">(must exist to start)</text>
  <text class="s" x="820" y="235" fill="#a77835">dashed: guard</text>
  <text class="s" x="820" y="255" fill="#a77835">(must be true to keep)</text>
  <text class="s" x="820" y="360">all three share one DrawId;</text>
  <text class="s" x="820" y="380">different NodeIds and seeds</text>
</svg>
