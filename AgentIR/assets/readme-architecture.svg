<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title description">
  <title id="title">AgentIR: speculative execution across agent decisions</title>
  <desc id="description">Read left to right. A Python program generates candidates, ranks them, and continues from a choice. The tracer constructs a guarded intermediate representation: each continuation has a solid data edge from its candidate and a dashed keep-or-cancel edge from the decision. The scheduler executes ready work on vLLM and tool workers. When the decision selects A, continuation A survives and continuation B is cancelled. No request crosses a missing data dependency.</desc>
  <defs>
    <marker id="flow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" fill="none" stroke="#546b83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="guard" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="m1 1 5 3-5 3" fill="none" stroke="#a77835" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #233746; }
      .heading { font-size: 22px; font-weight: 650; }
      .label { font-size: 18px; font-weight: 600; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #5c6d7c; }
      .mono text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 16px; }
      .line { fill: none; stroke: #546b83; stroke-width: 1.6; marker-end: url(#flow); }
      .guard { fill: none; stroke: #a77835; stroke-width: 1.6; stroke-dasharray: 5 4; marker-end: url(#guard); }
      .frame { fill: #fff; stroke: #d4dfe5; stroke-width: 1.3; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="548" rx="16" fill="#fff" stroke="#e3e9ed"/>

  <!-- The three stages are structural boundaries, not serial execution barriers. -->
  <text x="34" y="45" class="small">01 / PROGRAM</text>
  <text x="34" y="77" class="heading">Express the next step</text>
  <text x="334" y="45" class="small">02 / TRACER + GUARDED IR</text>
  <text x="334" y="77" class="heading">Expose the possible futures</text>
  <text x="877" y="45" class="small">03 / RUNTIME</text>
  <text x="877" y="77" class="heading">Run ahead, then commit</text>

  <!-- A compact program sketch shows the transformation's input. -->
  <rect x="34" y="113" width="242" height="276" rx="8" class="frame"/>
  <path d="M34 158h242" stroke="#e3e9ed"/>
  <circle cx="53" cy="136" r="4" fill="#a8bac5"/>
  <text x="67" y="142" class="small">Python agent program</text>
  <g class="mono">
    <text x="52" y="192">pool = expand(...)</text>
    <text x="52" y="227">rank = op(score, ...)</text>
    <text x="52" y="262">pick = choose(pool,</text>
    <text x="100" y="287">by=rank)</text>
    <text x="52" y="327" style="fill: #16766d">infer(pick[0])</text>
  </g>
  <text x="52" y="365" class="small">Continue from a choice.</text>
  <path class="line" d="M284 248h37"/>

  <!-- Data flows down the two outer paths. The decision only adds guards. -->
  <rect x="334" y="113" width="490" height="336" rx="8" fill="#f8fafb" stroke="#e3e9ed"/>
  <text x="355" y="143" class="small">Inputs ready</text>

  <rect x="359" y="166" width="132" height="48" rx="6" fill="#eef3f9" stroke="#b7c8d9"/>
  <text x="425" y="197" text-anchor="middle" class="label">Candidate A</text>
  <rect x="667" y="166" width="132" height="48" rx="6" fill="#eef3f9" stroke="#b7c8d9"/>
  <text x="733" y="197" text-anchor="middle" class="label">Candidate B</text>

  <path class="line" d="M425 214v95"/>
  <path class="line" d="M733 214v95"/>
  <path class="line" d="M491 191 545 236"/>
  <path class="line" d="M667 191 613 236"/>

  <path d="m579 214 64 38-64 38-64-38z" fill="#fcf5e9" stroke="#c9a872" stroke-width="1.3"/>
  <text x="579" y="248" text-anchor="middle" class="label">Choose</text>
  <text x="579" y="270" text-anchor="middle" class="small">A or B</text>

  <path class="guard" d="M549 273 478 309"/>
  <path class="guard" d="M609 273 680 309"/>
  <rect x="349" y="314" width="172" height="59" rx="6" fill="#eef7f4" stroke="#99bfb3"/>
  <text x="435" y="339" text-anchor="middle" class="label">Continue A</text>
  <text x="435" y="361" text-anchor="middle" class="small">guard: choose A</text>
  <rect x="637" y="314" width="172" height="59" rx="6" fill="#eef7f4" stroke="#99bfb3"/>
  <text x="723" y="339" text-anchor="middle" class="label">Continue B</text>
  <text x="723" y="361" text-anchor="middle" class="small">guard: choose B</text>

  <text x="579" y="398" text-anchor="middle" class="small">Both may start while the choice is pending.</text>
  <path class="line" d="M356 428h33"/>
  <text x="399" y="434" class="small">Input data</text>
  <path class="guard" d="M572 428h33"/>
  <text x="615" y="434" class="small">Keep / cancel decision</text>
  <path class="line" d="M832 248h19v-81h21"/>

  <!-- One scheduler, real execution backends, and conditional publication. -->
  <rect x="877" y="113" width="289" height="108" rx="8" class="frame"/>
  <text x="897" y="145" class="label">Scheduler</text>
  <text x="897" y="176" class="body">Committed work first</text>
  <text x="897" y="201" class="small">Speculate within a budget.</text>
  <path d="M1021 221v20" fill="none" stroke="#546b83" stroke-width="1.6"/>
  <path class="line" d="M1021 241h-75v16"/>
  <path class="line" d="M1021 241h75v16"/>
  <rect x="877" y="262" width="139" height="64" rx="6" fill="#eef3f9" stroke="#b7c8d9"/>
  <text x="946" y="290" text-anchor="middle" class="label">vLLM</text>
  <text x="946" y="313" text-anchor="middle" class="small">Model requests</text>
  <rect x="1027" y="262" width="139" height="64" rx="6" class="frame"/>
  <text x="1096" y="290" text-anchor="middle" class="label">Tool workers</text>
  <text x="1096" y="313" text-anchor="middle" class="small">Effect-aware</text>

  <text x="877" y="361" class="small">When the decision selects A:</text>
  <path d="m881 388 5 5 10-12" fill="none" stroke="#16766d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="907" y="394" class="body">Keep continuation A</text>
  <path d="m882 414 10 10m0-10-10 10" fill="none" stroke="#856e69" stroke-width="1.8" stroke-linecap="round"/>
  <text x="907" y="425" class="body">Cancel continuation B</text>

  <path d="M34 464h1132" stroke="#e3e9ed"/>
  <text x="600" y="497" text-anchor="middle" class="body">A continuation needs its candidate's data. The decision only determines whether it survives.</text>
  <text x="600" y="523" text-anchor="middle" class="small">Tracing and execution overlap; the program does not wait for the entire graph to be built.</text>
</svg>
