<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 420" role="img" aria-labelledby="t d">
  <title id="t">Life of an engine record</title>
  <desc id="d">A registered record is pending until its data is ready. The scheduler issues it as a physical attempt, committed if its guard is true or speculative if pending. An attempt ends done, or returns to pending after preemption or a retryable failure. Independently, the guard resolves: true commits the record, false squashes it and cancels a running attempt, and an unmasked failure fails it. A record can be done before it is committed.</desc>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="m1 1 6 3.5-6 3.5" fill="none" stroke="#546b83" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="m1 1 6 3.5-6 3.5" fill="none" stroke="#a77835" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#233746;font-size:14px}
      .h{font-size:15px;font-weight:650}.s{font-size:12.5px;fill:#5c6d7c}
      .box{fill:#fff;stroke:#cfd9de;stroke-width:1.3}
      .spec{fill:#e6eef8;stroke:#4f79a8}.keep{fill:#dcefe6;stroke:#4e8a72}.dead{fill:#f6e6e3;stroke:#b0574c}
      .l{fill:none;stroke:#546b83;stroke-width:1.5;marker-end:url(#a)}
      .g{fill:none;stroke:#a77835;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#b)}
    </style>
  </defs>
  <rect x="1" y="1" width="1158" height="418" rx="12" fill="#fff" stroke="#e3e9ed"/>
  <text class="h" x="26" y="34">Status · what the engine is doing</text>

  <rect class="box" x="26" y="60" width="130" height="50" rx="8"/><text class="h" x="91" y="90" text-anchor="middle">registered</text>
  <path class="l" d="M156 85h94"/><text class="s" x="168" y="76">deps done</text>
  <rect class="box" x="250" y="60" width="130" height="50" rx="8"/><text class="h" x="315" y="90" text-anchor="middle">pending</text>
  <path class="l" d="M380 85h94"/><text class="s" x="398" y="76">slot free</text>
  <rect class="box spec" x="474" y="60" width="150" height="50" rx="8"/><text class="h" x="549" y="90" text-anchor="middle">issued</text>
  <path class="l" d="M624 85h94"/><text class="s" x="630" y="76">stream ends</text>
  <rect class="box" x="718" y="60" width="130" height="50" rx="8"/><text class="h" x="783" y="90" text-anchor="middle">done</text>
  <rect class="box dead" x="990" y="60" width="140" height="50" rx="8"/><text class="h" x="1060" y="90" text-anchor="middle">squashed</text>

  <text class="s" x="474" y="132">one attempt, fresh request id</text>
  <text class="s" x="474" y="150">priority 0 if the guard is true</text>
  <text class="s" x="474" y="168">else priority = guard depth</text>
  <text class="s" x="718" y="132">atoms on file; children are</text>
  <text class="s" x="718" y="150">data-ready even while the</text>
  <text class="s" x="718" y="168">guard is still pending</text>
  <text class="s" x="990" y="132">guard turned false while</text>
  <text class="s" x="990" y="150">pending or issued: the</text>
  <text class="s" x="990" y="168">attempt is aborted now</text>

  <path class="l" d="M549 110v78H315v-78"/>
  <text class="s" x="26" y="214">back to pending with the same NodeId and seed: preempted by committed work · pruned · engine death · retryable failure</text>

  <text class="h" x="26" y="262" fill="#a77835">Guard · whether the world survives (resolves independently of status)</text>
  <rect class="box" x="26" y="286" width="130" height="50" rx="8"/><text class="h" x="91" y="316" text-anchor="middle">pending</text>
  <path class="g" d="M156 311h94"/>
  <rect class="box keep" x="250" y="286" width="130" height="50" rx="8"/><text class="h" x="315" y="316" text-anchor="middle">true</text>
  <text class="s" x="250" y="372">commit: force() may publish</text>
  <text class="s" x="250" y="390">done + true = committed</text>
  <path class="g" d="M91 336v14h520v-14"/>
  <rect class="box dead" x="546" y="286" width="130" height="50" rx="8"/><text class="h" x="611" y="316" text-anchor="middle">false</text>
  <text class="s" x="546" y="372">squash: abort the attempt;</text>
  <text class="s" x="546" y="390">atoms stay unpublished (wasted)</text>
  <path class="g" d="M91 336v14h800v-14"/>
  <rect class="box dead" x="826" y="286" width="130" height="50" rx="8"/><text class="h" x="891" y="316" text-anchor="middle">failed</text>
  <text class="s" x="826" y="372">a deciding op raised; surfaces</text>
  <text class="s" x="826" y="390">only if no false conjunct masks it</text>

  <path class="g" d="M611 286v-52h449v-124"/>
</svg>
